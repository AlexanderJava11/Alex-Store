<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Admin - Alex Store</title>
  </head>
  <body>
    <nav class="site-nav navbar navbar-expand-lg">
      <div class="container-fluid nav-wrap">
        <a class="navbar-brand brand" href="index.html">Alex Store</a>
        <div class="nav-links ms-auto">
          <a class="nav-link" href="index.html">Butiken</a>
          <button class="btn btn-outline-secondary btn-sm" id="themeBtn">
            Tema
          </button>
          <button class="btn btn-danger btn-sm" id="logoutBtn">Logga ut</button>
        </div>
      </div>
    </nav>
    <div class="container">
      <div class="section-head fade-in">
        <h1 class="section-title">Admin Dashboard</h1>
        <p>Översikt över beställningar, kunder och försäljning.</p>
      </div>
      <div class="row g-4 mb-4">
        <div class="col-md-3">
          <div class="stat-card">
            <div class="small">Antal beställningar</div>
            <div id="totalOrders" class="admin-metric">0</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <div class="small">Total försäljning</div>
            <div id="totalRevenue" class="admin-metric">0.00 kr</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <div class="small">Kort</div>
            <div id="cardCount" class="admin-metric">0</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card">
            <div class="small">Swish/Klarna</div>
            <div id="otherCount" class="admin-metric">0</div>
          </div>
        </div>
      </div>
      <div class="panel mb-4">
        <div class="d-flex gap-2 flex-wrap">
          <button id="refreshAdminBtn" class="btn btn-primary">
            Uppdatera statistik</button
          ><button id="clearOrdersBtn" class="btn btn-danger">
            Rensa alla beställningar
          </button>
        </div>
      </div>
      <div id="adminOrdersEmpty" class="empty-box">
        Det finns inga beställningar ännu.
      </div>
      <div id="adminOrdersContainer"></div>
    </div>
    <script src="common.js"></script>
    <script src="admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
